name: Build QinShu IME (Android APK)

on:
  push:
    branches: [ main, master ]
    tags: [ 'android-v*', 'v*' ]
    paths:
      - 'android/**'
      - 'cmd/dictbuild/**'
      - 'data/pinyin.txt'
      - 'data/english.txt'
      - 'data/emoji_pinyin.txt'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Android release version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#android-v}"
            VER="${VER#v}"
            PUBLISH="true"
          else
            HEAD_TAG=$(git tag --points-at HEAD "android-v*" "v*" | head -n 1 || true)
            if [ -n "$HEAD_TAG" ]; then
              TAG="$HEAD_TAG"
              VER="${TAG#android-v}"
              VER="${VER#v}"
              PUBLISH="false"
            else
              BASE_VER=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -n 1)
              BASE_VER="${BASE_VER:-1.1.0}"
              VER="${BASE_VER}.${GITHUB_RUN_NUMBER}"
              TAG="android-v${VER}"
              PUBLISH="true"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Android release tag=${TAG} version=${VER} publish=${PUBLISH}"

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run dictbuild tests & compile qinshu.qdict
        run: |
          go test -v ./cmd/dictbuild/...
          go run ./cmd/dictbuild \
            -data data \
            -out android/app/src/main/assets/qinshu.qdict
          ls -lh android/app/src/main/assets/qinshu.qdict

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/qinshu-release.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/qinshu-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Android unit tests & assemble Release APK
        working-directory: android
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle testReleaseUnitTest assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee gradle-build.log; then
            grep -E '(^e: |FAILURE:|What went wrong:|Execution failed|Exception|Test .* FAILED)' gradle-build.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 gradle-build.log | head -n 8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Prepare Release artifact
        run: |
          mkdir -p dist-android
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_DST="dist-android/QinShu-IME-Android-${{ steps.meta.outputs.tag }}.apk"
          cp "$APK_SRC" "$APK_DST"
          sha256sum "$APK_DST" > "${APK_DST}.sha256"
          ls -lh dist-android/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QinShu-IME-Android-${{ steps.meta.outputs.tag }}
          path: dist-android/

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Qin书输入法 Android ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist-android/QinShu-IME-Android-${{ steps.meta.outputs.tag }}.apk
            dist-android/QinShu-IME-Android-${{ steps.meta.outputs.tag }}.apk.sha256
