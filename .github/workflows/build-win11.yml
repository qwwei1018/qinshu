name: Build QinShu IME (Win11 Native TSF + Go Engine)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win11:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref.StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
            $publish = "true"
          } else {
            $headTags = @(git tag --points-at HEAD "v*" 2>$null | Where-Object { $_ -ne "" })
            if ($headTags.Count -gt 0) {
              $tag = $headTags[0]
              $publish = "false"
            } else {
              $cfg = Get-Content -Raw "internal/config/config.go"
              if ($cfg -match 'AppVersion\s*=\s*"([^"]+)"') {
                $ver = $Matches[1]
              } else {
                $ver = "2.0.1"
              }
              $tag = "v$ver.${{ github.run_number }}"
              $publish = "true"
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag=$tag publish=$publish"

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go unit tests
        run: go test -v ./...

      - name: Embed Windows 11 Icon (qinshu.ico)
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -arch amd64 -ico assets/qinshu.ico -o cmd/qinshu/rsrc_windows_amd64.syso

      - name: Build Go Engine (Qin书.exe)
        run: |
          New-Item -ItemType Directory -Force -Path dist/Qin书 | Out-Null
          go build -ldflags="-H windowsgui -s -w" -o dist/Qin书/Qin书.exe ./cmd/qinshu

      - name: Build Native TSF COM DLL (x64, Static CRT /MT, ~150KB)
        run: |
          cmake -S tsf -B build-tsf-x64 -A x64
          cmake --build build-tsf-x64 --config Release
          Copy-Item build-tsf-x64/Release/QinShuTSF.dll dist/Qin书/QinShuTSF_x64.dll

      - name: Build Native TSF COM DLL (x86 for 32-bit Apps, Static CRT /MT)
        run: |
          cmake -S tsf -B build-tsf-x86 -A Win32
          cmake --build build-tsf-x86 --config Release
          Copy-Item build-tsf-x86/Release/QinShuTSF.dll dist/Qin书/QinShuTSF_x86.dll

      - name: Bundle Data, Assets & Install Scripts
        run: |
          Copy-Item -Recurse data dist/Qin书/data
          Copy-Item -Recurse assets dist/Qin书/assets
          if (Test-Path README.md) { Copy-Item README.md dist/Qin书/README.md }
          Copy-Item 安装_Qin书TSF.bat dist/Qin书/安装_Qin书TSF.bat
          Copy-Item 卸载_Qin书TSF.bat dist/Qin书/卸载_Qin书TSF.bat
          Copy-Item 下载十万大词库.bat dist/Qin书/下载十万大词库.bat
          Copy-Item dist/Qin书/Qin书.exe dist/QinShu-Portable.exe
          Compress-Archive -Path dist/Qin书/* -DestinationPath "dist/QinShu-IME-TSF-Win11-Full-${{ steps.meta.outputs.tag }}.zip" -Force

      - name: Upload Windows 11 Native TSF Full Package
        uses: actions/upload-artifact@v4
        with:
          name: QinShu-IME-TSF-Win11-Full-${{ steps.meta.outputs.tag }}
          path: dist/Qin书/

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Qin书输入法 ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/QinShu-IME-TSF-Win11-Full-${{ steps.meta.outputs.tag }}.zip
            dist/QinShu-Portable.exe
